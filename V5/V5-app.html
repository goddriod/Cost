<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Activity & Cost Manager V5</title>
<style>
:root{--bg:#e9edf2;--panel:#fff;--bar:#1f3a5f;--bart:#fff;--line:#cfd6df;--head:#dfe6ee;--sel:#cfe3fb;--alt:#f6f8fb;--txt:#1b2430;--mut:#64707f;--acc:#1f6fd1;--neg:#c0392b;--pos:#1e8449;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171e;--panel:#1a212b;--bar:#0e2340;--line:#303b49;--head:#243040;--sel:#27456e;--alt:#1e2631;--txt:#e4e9f0;--mut:#8f9cad;--acc:#5aa2f5;--neg:#ff7b6b;--pos:#59c48a}}
:root[data-theme="dark"]{--bg:#12171e;--panel:#1a212b;--bar:#0e2340;--line:#303b49;--head:#243040;--sel:#27456e;--alt:#1e2631;--txt:#e4e9f0;--mut:#8f9cad;--acc:#5aa2f5;--neg:#ff7b6b;--pos:#59c48a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:13px/1.35 "Segoe UI",Tahoma,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--bar);color:var(--bart);padding:6px 12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:14px;margin:0;font-weight:600}header span{opacity:.75;font-size:12px}
.tb{display:flex;gap:6px;padding:6px 8px;background:var(--head);border-bottom:1px solid var(--line);align-items:center}
button{font:inherit;color:var(--txt);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}button.p{background:var(--acc);border-color:var(--acc);color:#fff}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.tb .sp{flex:1}
#top{flex:1 1 55%;min-height:90px;overflow:auto;background:var(--panel)}
#split{height:7px;background:var(--head);border-top:1px solid var(--line);border-bottom:1px solid var(--line);cursor:row-resize;flex:none;touch-action:none}
#bot{flex:1 1 45%;min-height:90px;display:flex;flex-direction:column;background:var(--panel)}
.tabs{display:flex;background:var(--head);border-bottom:1px solid var(--line);align-items:flex-end;padding:4px 8px 0;gap:2px}
.tab{padding:5px 14px;border:1px solid transparent;border-bottom:0;border-radius:3px 3px 0 0;cursor:pointer;color:var(--mut)}
.tab.on{background:var(--panel);border-color:var(--line);color:var(--txt);font-weight:600;margin-bottom:-1px}
.tabs .ttl{margin-left:auto;color:var(--mut);font-size:12px;padding-bottom:5px}
#pane{flex:1;overflow:auto;padding:8px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{border:1px solid var(--line);padding:3px 7px;white-space:nowrap}
th{background:var(--head);position:sticky;top:0;text-align:left;font-weight:600;z-index:1}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
#top tbody tr{cursor:default}#top tbody tr:nth-child(even){background:var(--alt)}#top tbody tr.sel{background:var(--sel)}
tfoot td{font-weight:600;background:var(--head);position:sticky;bottom:0}
.neg{color:var(--neg)}.pos{color:var(--pos)}
td input,td select{width:100%;border:0;background:transparent;color:inherit;font:inherit;padding:2px 0}
td input.n{text-align:right}td input:focus,td select:focus{background:var(--panel)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px;max-width:900px}
.form label{display:flex;flex-direction:column;gap:3px;color:var(--mut);font-size:12px}
.form input,.form select{font:inherit;padding:5px 7px;border:1px solid var(--line);border-radius:3px;background:var(--panel);color:var(--txt)}
.form input:disabled{background:var(--alt);color:var(--mut)}
.note{color:var(--mut);margin:8px 0;font-size:12px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;max-width:900px}
.sum div{border:1px solid var(--line);padding:8px 10px;border-radius:3px}.sum b{display:block;font-size:17px;font-variant-numeric:tabular-nums}.sum small{color:var(--mut)}
.empty{color:var(--mut);padding:24px;text-align:center}
.tb{flex-wrap:wrap}#psel,.pn{font:inherit;padding:4px 7px;border:1px solid var(--line);border-radius:3px;background:var(--panel);color:var(--txt)}#psel{max-width:220px}.pn{flex:1 1 140px;min-width:120px}[hidden]{display:none!important}.grp{display:flex;gap:6px}button.on{background:var(--bar);color:#fff;border-color:var(--bar)}
.tot{display:block;font-weight:700;color:var(--acc);min-height:1.35em}.tot.neg{color:var(--neg)}
#top tbody tr{background:var(--panel)}
#top th:nth-child(-n+2),#top td:nth-child(-n+2){position:sticky;z-index:2;background:inherit;overflow:hidden;text-overflow:ellipsis}
#top th:nth-child(-n+2){z-index:4;background:var(--head)}
#top th:first-child,#top td:first-child{left:0;width:100px;min-width:100px;max-width:100px}
#top th:nth-child(2),#top td:nth-child(2){left:100px;min-width:150px;max-width:190px;box-shadow:2px 0 0 var(--line)}
</style></head><body>
<header><h1>Activity &amp; Cost Manager</h1><span id="ver"></span></header>
<div class="tb"><select id="psel" aria-label="Project"></select><input class="pn" id="pname" aria-label="Project name"><button id="pnew">New</button><button id="pdup">Duplicate</button><button id="pdel">Delete</button><span class="sp"></span><button id="pexp">Export</button><button id="pall">Backup all</button><button id="pimp">Import</button><input type="file" id="pfile" accept=".json,application/json" hidden></div>
<div class="tb"><button id="vact" class="on">Activities</button><button id="vwbs">WBS</button><span class="sp"></span><span id="actbar" class="grp"><button class="p" id="add">Add activity</button><button id="del">Delete activity</button></span><span id="wbsbar" class="grp" hidden><button class="p" id="wadd">Add WBS</button></span><span id="cnt" style="color:var(--mut)"></span></div>
<div id="top"></div>
<div id="split" title="Drag to resize"></div>
<div id="bot"><div class="tabs" id="tabs"></div><div id="pane"></div></div>
<script>
const $=s=>document.querySelector(s);
const CATS=['Labor','Materials','Equipment','Subcontract','Permits & fees','Other'];
let nx=1,ex=1;
const E=(item,cat,bud,act,acc,rem=null)=>({id:'EX'+String(ex++).padStart(4,'0'),item,cat,bud,act,rem,acc});
const sampleActs=()=>{ex=1;return [
 {id:'A1000',name:'Site mobilization',wbs:'1.1',dur:10,mode:'direct',bud:48000,act:48000,rem:null,ex:[]},
 {id:'A1010',name:'Excavation & shoring',wbs:'1.2',dur:25,mode:'rollup',bud:0,act:0,rem:null,ex:[E('Excavation crew','Labor',90000,95000,'Uniform',0),E('Shoring steel','Materials',120000,118000,'Start',0),E('Excavator rental','Equipment',60000,41000,'Uniform')]},
 {id:'A1020',name:'Foundation concrete',wbs:'2.1',dur:30,mode:'rollup',bud:0,act:0,rem:null,ex:[E('Ready-mix concrete','Materials',210000,120000,'Uniform'),E('Rebar supply','Materials',95000,95000,'Start'),E('Pump truck','Equipment',24000,9000,'Uniform'),E('Concrete finishers','Labor',70000,38000,'Uniform')]},
 {id:'A1030',name:'Structural steel erection',wbs:'2.2',dur:45,mode:'rollup',bud:0,act:0,rem:null,ex:[E('Steel fabrication','Subcontract',480000,150000,'Start'),E('Crane hire','Equipment',130000,0,'Uniform'),E('Erection crew','Labor',160000,0,'End')]},
 {id:'A1040',name:'Building permit renewal',wbs:'2.3',dur:5,mode:'direct',bud:18500,act:21200,rem:0,ex:[]},
 {id:'A1050',name:'MEP rough-in',wbs:'3.1',dur:40,mode:'direct',bud:325000,act:60000,rem:null,ex:[]},
 {id:'A1060',name:'Facade & glazing',wbs:'3.2',dur:35,mode:'rollup',bud:0,act:0,rem:null,ex:[E('Curtain wall panels','Materials',410000,0,'Start'),E('Glazing installers','Subcontract',185000,0,'Uniform')]},
 {id:'A1070',name:'Commissioning & handover',wbs:'4.1',dur:15,mode:'direct',bud:42000,act:0,rem:null,ex:[]}
];};
const sampleWbs=()=>[['1','Site works'],['1.1','Mobilization'],['1.2','Earthworks'],['2','Structure'],['2.1','Substructure'],['2.2','Superstructure'],['2.3','Approvals'],['3','Services & envelope'],['3.1','MEP'],['3.2','Facade'],['4','Closeout'],['4.1','Commissioning']].map(([code,name])=>({code,name}));
let acts=[],sel=null,tab='exp',view='act';
const num=v=>{v=parseFloat(v);return isFinite(v)?v:0};
const autoRem=(b,a)=>Math.max(0,b-a);
const remOf=(b,a,r)=>r==null?autoRem(b,a):r;
function calc(a){let bud,act,rem;
 if(a.mode==='rollup'){bud=a.ex.reduce((s,x)=>s+x.bud,0);act=a.ex.reduce((s,x)=>s+x.act,0);rem=a.ex.reduce((s,x)=>s+remOf(x.bud,x.act,x.rem),0)}
 else{bud=a.bud;act=a.act;rem=remOf(a.bud,a.act,a.rem)}
 const ac=act+rem;return{bud,act,rem,ac,vac:bud-ac}}
const f=v=>'₦'+Math.round(v).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vc=v=>`<td class="n ${v<-0.5?'neg':v>0.5?'pos':''}">${v<-0.5?'('+f(-v)+')':f(v)}</td>`;
const cur=()=>acts.find(a=>a.id===sel);

const fv=v=>v<-0.5?'('+f(-v)+')':f(v);
const H=(l,v,c)=>`<th class="n">${l}<span class="tot ${c||''}">${v}</span></th>`;
const B='<span class="tot">&nbsp;</span>';
function renderTable(){
 if(view==='wbs'){renderWbs();queueSave();return}
 let t={bud:0,act:0,rem:0,ac:0,vac:0};
 const rows=acts.map(a=>{const c=calc(a);for(const k in t)t[k]+=c[k];
  return`<tr data-id="${a.id}" class="${a.id===sel?'sel':''}"><td>${esc(a.id)}</td><td>${esc(a.name)}</td><td>${esc(wbsName(a.wbs))}</td><td class="n">${a.dur}d</td><td class="n">${f(c.bud)}</td><td class="n">${f(c.act)}</td><td class="n">${f(c.rem)}</td><td class="n">${f(c.ac)}</td>${vc(c.vac)}</tr>`}).join('');
 $('#top').innerHTML=`<table><thead><tr><th>Activity ID<span class="tot">Total</span></th><th>Activity Name${B}</th><th>WBS${B}</th><th class="n">Duration<span class="tot">${acts.reduce((n,a)=>n+a.dur,0)}d</span></th>${H('Budgeted Total Cost',f(t.bud))}${H('Actual Total Cost',f(t.act))}${H('Remaining Cost',f(t.rem))}${H('At Completion Cost',f(t.ac))}${H('Variance at Completion',fv(t.vac),t.vac<-0.5?'neg':'')}</tr></thead><tbody>${rows||'<tr><td colspan="9" class="empty">No activities yet. Select Add activity to create one.</td></tr>'}</tbody></table>`;
 $('#cnt').textContent=acts.length+' activities';queueSave();
}
const wcmp=(a,b)=>{const x=a.split('.'),y=b.split('.');for(let i=0;i<Math.max(x.length,y.length);i++){const p=x[i],q=y[i];if(p===undefined)return -1;if(q===undefined)return 1;const d=parseFloat(p)-parseFloat(q);if(d)return d;if(p!==q)return p<q?-1:1}return 0};
const wsort=()=>P.wbs.sort((a,b)=>wcmp(a.code,b.code));
const wbsName=c=>{const w=P.wbs.find(x=>x.code===c);return w?w.name:c};
function wbsCost(code){const t={n:0,bud:0,act:0,ac:0};acts.forEach(a=>{if(a.wbs===code||a.wbs.startsWith(code+'.')){const c=calc(a);t.n++;t.bud+=c.bud;t.act+=c.act;t.ac+=c.ac}});return t}
function wbsOptions(cur){let h='<option value="">(none)</option>';const L=P.wbs.map(w=>w.code);
 if(cur&&!L.includes(cur))h+=`<option value="${esc(cur)}" selected>${esc(cur)} (not in WBS list)</option>`;
 return h+P.wbs.map(w=>`<option value="${esc(w.code)}" ${w.code===cur?'selected':''}>${esc(w.name+(P.wbs.filter(x=>x.name===w.name).length>1?' ('+w.code+')':''))}</option>`).join('')}
function renderWbs(){
 const T=acts.reduce((o,a)=>{const c=calc(a);o.bud+=c.bud;o.act+=c.act;o.ac+=c.ac;return o},{bud:0,act:0,ac:0});
 const rows=P.wbs.map((w,i)=>{const c=wbsCost(w.code),d=w.code.split('.').length-1;
  return`<tr data-w="${i}"><td><input data-w="code" value="${esc(w.code)}"></td><td><input data-w="name" style="padding-left:${d*16}px" value="${esc(w.name)}"></td><td class="n">${c.n}</td><td class="n">${f(c.bud)}</td><td class="n">${f(c.act)}</td><td class="n">${f(c.ac)}</td>${vc(c.bud-c.ac)}<td><button data-wc="${i}">Add child</button> <button data-wd="${i}">Delete</button></td></tr>`}).join('');
 $('#top').innerHTML=`<table><thead><tr><th>WBS Code<span class="tot">Project total</span></th><th>WBS Name${B}</th><th class="n">Activities<span class="tot">${acts.length}</span></th>${H('Budgeted Total Cost',f(T.bud))}${H('Actual Total Cost',f(T.act))}${H('At Completion Cost',f(T.ac))}${H('Variance at Completion',fv(T.bud-T.ac),T.bud-T.ac<-0.5?'neg':'')}<th>${B}</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">No WBS yet. Select Add WBS, then pick it from the WBS list on an activity’s General tab.</td></tr>'}</tbody></table><p class="note" style="padding:0 8px">Costs include child elements (for example 2 includes 2.1 and 2.2). Use dotted codes to build levels.</p>`}
function renderTabs(){
 const a=cur();
 $('#tabs').innerHTML=[['gen','General'],['exp','Expenses'],['cost','Cost Summary']].map(([k,l])=>`<div class="tab ${tab===k?'on':''}" data-t="${k}" role="tab" tabindex="0">${l}</div>`).join('')+`<span class="ttl">${a?esc(a.id+' · '+a.name):''}</span>`;
}
function renderPane(){
 const a=cur(),p=$('#pane');
 if(!a){p.innerHTML='<div class="empty">Select an activity to see its details.</div>';return}
 const c=calc(a);
 if(tab==='gen'){
  const ro=a.mode==='rollup';
  p.innerHTML=`<div class="form">
  <label>Activity ID<input data-f="id" value="${esc(a.id)}"></label>
  <label>Activity Name<input data-f="name" value="${esc(a.name)}"></label>
  <label>WBS<select data-f="wbs">${wbsOptions(a.wbs)}</select></label>
  <label>Duration (days)<input data-f="dur" type="number" min="0" value="${a.dur}"></label>
  <label>Cost source<select data-f="mode"><option value="direct" ${ro?'':'selected'}>Enter directly</option><option value="rollup" ${ro?'selected':''}>Roll up from expenses</option></select></label>
  <label>Budgeted Total Cost<input data-f="bud" type="number" min="0" ${ro?'disabled':''} value="${ro?c.bud:a.bud}"></label>
  <label>Actual Total Cost<input data-f="act" type="number" min="0" ${ro?'disabled':''} value="${ro?c.act:a.act}"></label>
  <label>Remaining Cost${ro?'':' (blank = auto)'}<input data-f="rem" type="number" min="0" ${ro?'disabled':''} placeholder="${f(autoRem(a.bud,a.act))}" value="${ro?c.rem:(a.rem==null?'':a.rem)}"></label></div>
  <p class="note">${P.wbs.length?'':'No WBS created yet. Add elements in the WBS view, then choose one here. '}${ro?'Costs are summed from this activity’s expenses. Edit them on the Expenses tab.':'Remaining defaults to Budgeted − Actual (never below zero). Type a value to override it.'}</p>`;
 }else if(tab==='exp'){
  const rows=a.ex.map((x,i)=>`<tr data-i="${i}"><td>${esc(x.id)}</td><td><input data-x="item" value="${esc(x.item)}"></td><td><select data-x="cat">${CATS.map(k=>`<option ${k===x.cat?'selected':''}>${k}</option>`).join('')}</select></td><td><input class="n" type="number" min="0" data-x="bud" value="${x.bud}"></td><td><input class="n" type="number" min="0" data-x="act" value="${x.act}"></td><td><input class="n" type="number" min="0" data-x="rem" placeholder="${Math.round(autoRem(x.bud,x.act))}" value="${x.rem==null?'':x.rem}"></td><td><select data-x="acc">${['Uniform','Start','End'].map(k=>`<option ${k===x.acc?'selected':''}>${k}</option>`).join('')}</select></td><td><button data-d="${i}" aria-label="Delete expense">Delete</button></td></tr>`).join('');
  const s=a.ex.reduce((o,x)=>(o.b+=x.bud,o.a+=x.act,o.r+=remOf(x.bud,x.act,x.rem),o),{b:0,a:0,r:0});
  p.innerHTML=`<div style="margin-bottom:6px"><button class="p" id="addx">Add expense</button></div>
  <table><thead><tr><th>Expense ID<span class="tot">Total</span></th><th>Expense Item${B}</th><th>Category${B}</th>${H('Budgeted Cost',f(s.b))}${H('Actual Cost',f(s.a))}${H('Remaining Cost',f(s.r))}<th>Accrual Type${B}</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">No expenses yet. Select Add expense.</td></tr>'}</tbody></table>
  <p class="note">${a.mode==='rollup'?'These expenses drive the activity’s costs.':'This activity is set to direct entry, so expenses are not counted. Switch Cost source to “Roll up from expenses” on the General tab.'} Leave Remaining blank to calculate Budgeted − Actual.</p>`;
 }else{
  p.innerHTML=`<div class="sum"><div><small>Budgeted Total Cost</small><b>${f(c.bud)}</b></div><div><small>Actual Total Cost</small><b>${f(c.act)}</b></div><div><small>Remaining Cost</small><b>${f(c.rem)}</b></div><div><small>At Completion Cost (Actual + Remaining)</small><b>${f(c.ac)}</b></div><div><small>Variance at Completion (Budgeted − At Completion)</small><b class="${c.vac<-0.5?'neg':c.vac>0.5?'pos':''}">${c.vac<-0.5?'('+f(-c.vac)+')':f(c.vac)}</b></div></div>
  <p class="note">${c.vac<-0.5?'Forecast is over budget.':c.vac>0.5?'Forecast is under budget.':'Forecast matches budget.'} Source: ${a.mode==='rollup'?'rolled up from '+a.ex.length+' expense(s)':'direct entry'}.</p>`;
 }
}
const all=()=>{renderTable();renderTabs();renderPane()};

$('#top').onclick=e=>{const r=e.target.closest('tr[data-id]');if(r){sel=r.dataset.id;all()}};
$('#tabs').onclick=e=>{const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;renderTabs();renderPane()}};
$('#add').onclick=()=>{const a={id:nextId(),name:'New activity',wbs:'',dur:1,mode:'direct',bud:0,act:0,rem:null,ex:[]};acts.push(a);sel=a.id;tab='gen';all();$('#top').scrollTop=1e6};
$('#del').onclick=()=>{const i=acts.findIndex(a=>a.id===sel);if(i<0)return;acts.splice(i,1);sel=acts.length?acts[Math.min(i,acts.length-1)].id:null;all()};

const pane=$('#pane');
pane.addEventListener('input',e=>{ // live update for General fields
 const a=cur(),k=e.target.dataset.f;if(!a||!k||k==='mode')return;
 let v=e.target.value;
 if(k==='id'){v=v.trim();if(!v||acts.some(o=>o!==a&&o.id===v))return;sel=v}
 if(k==='dur')v=Math.max(0,Math.round(num(v)));
 if(k==='bud'||k==='act')v=num(v);
 if(k==='rem')v=v===''?null:num(v);
 a[k]=v;renderTable();renderTabs();
});
pane.addEventListener('change',e=>{
 const a=cur(),t=e.target;if(!a)return;
 if(t.dataset.f==='mode'){a.mode=t.value;all();return}
 const r=t.closest('tr[data-i]');
 if(r&&t.dataset.x){const x=a.ex[+r.dataset.i],k=t.dataset.x;
  x[k]=k==='rem'?(t.value===''?null:num(t.value)):(k==='bud'||k==='act')?num(t.value):t.value;
  renderTable();renderPane()}
});
pane.addEventListener('click',e=>{
 const a=cur();if(!a)return;
 if(e.target.id==='addx'){a.ex.push(E('New expense','Other',0,0,'Uniform'));renderTable();renderPane()}
 if(e.target.dataset.d!==undefined){a.ex.splice(+e.target.dataset.d,1);renderTable();renderPane()}
});

// resizable split
const sp=$('#split');
sp.addEventListener('pointerdown',e=>{sp.setPointerCapture(e.pointerId);
 const mv=ev=>{const h=document.body.clientHeight,top=$('#top').getBoundingClientRect().top;
  const y=Math.min(Math.max(ev.clientY-top,90),h-top-130);
  $('#top').style.flex='0 0 '+y+'px';$('#bot').style.flex='1 1 0'};
 sp.addEventListener('pointermove',mv);
 sp.addEventListener('pointerup',()=>sp.removeEventListener('pointermove',mv),{once:true})});
// ---- V1: projects, autosave, export/import ----
const VERSION='V5',KEY='p6cm-projects';let mem=null,P,S,tm;
const store={get(){try{return localStorage.getItem(KEY)}catch(e){return mem}},set(v){try{localStorage.setItem(KEY,v)}catch(e){mem=v}}};
const mk=(name,a,w)=>({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,acts:a,wbs:w,updated:Date.now()});
const nextId=()=>{const m=acts.reduce((m,a)=>{const r=/^A(\d+)$/.exec(a.id);return r?Math.max(m,+r[1]):m},990);return 'A'+(m+10)};
function queueSave(){clearTimeout(tm);tm=setTimeout(()=>{if(P){P.updated=Date.now();store.set(JSON.stringify(S))}},250)}
function flash(t){$('#cnt').textContent=t;setTimeout(()=>{$('#cnt').textContent=acts.length+' activities'},3000)}
function renderProj(){$('#psel').innerHTML=S.projects.map(p=>`<option value="${p.id}" ${p===P?'selected':''}>${esc(p.name)}</option>`).join('');$('#pname').value=P.name}
function openProject(id){P=S.projects.find(p=>p.id===id);S.cur=id;acts=P.acts;if(!Array.isArray(P.wbs)){P.wbs=[...new Set(acts.map(a=>a.wbs).filter(Boolean))].map(c=>({code:c,name:c}));wsort()}
 ex=1+acts.reduce((m,a)=>a.ex.reduce((m2,x)=>Math.max(m2,parseInt(String(x.id).slice(2))||0),m),0);
 sel=acts.length?acts[0].id:null;renderProj();all()}
const C15=[['A1','Setting out',30000],['A2','Excavation of trenches (378m)',680000],['A2c','Excavation of column bases (60 nos)',210000],['A2a','Packing of excess materials',80000],['A2b','Cleaning and blinding',50000],['A3','Casting of trenches and column bases',400000],['A4','Reinforcement to column bases and starters (60 nos)',300000],['A5','Block forming',80000],['A6','Block work (3,200 blocks)',480000],['A6a','Boarding of short columns',90000],['A7','Backfilling',280000],['A8','Watering and compaction',90000],['A9','Filling of block holes and casting of columns',150000],['A10','Plumbing',90000],['A11','DPM and hardcore',150000],['A12','Boarding of DPC',50000],['A13','Casting of DPC',400000]];
function seedC15(){S.seeded=S.seeded||[];if(S.seeded.includes('c15'))return;S.seeded.push('c15');
 const p=mk('C15: 5 units of 3bdrm',C15.map(([id,name,bud])=>({id,name,wbs:'',dur:5,mode:'direct',bud,act:0,rem:null,ex:[]})),[]);S.projects.push(p);S.cur=p.id;queueSave()}
function load(){let d=null;try{d=JSON.parse(store.get())}catch(e){}
 if(!d||!Array.isArray(d.projects)||!d.projects.length)d={projects:[mk('Harbor Point Mixed-Use Tower (sample)',sampleActs(),sampleWbs())]};
 S=d;seedC15();$('#ver').textContent=VERSION+' · projects save automatically on this device';
 openProject(S.projects.some(p=>p.id===S.cur)?S.cur:S.projects[0].id)}
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'project';
const pack=(ps,t)=>({app:'p6cm',version:VERSION,type:t,exported:new Date().toISOString(),projects:ps});
async function saveFile(name,obj){
 const blob=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}),file=new File([blob],name,{type:'application/json'});
 try{if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e.name==='AbortError')return}
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);flash('Saved '+name)}
const clean=a=>({id:String(a.id),name:String(a.name||''),wbs:String(a.wbs||''),dur:Math.max(0,num(a.dur)),mode:a.mode==='rollup'?'rollup':'direct',bud:num(a.bud),act:num(a.act),rem:a.rem==null?null:num(a.rem),
 ex:(Array.isArray(a.ex)?a.ex:[]).map(x=>({id:String(x.id),item:String(x.item||''),cat:String(x.cat||'Other'),bud:num(x.bud),act:num(x.act),rem:x.rem==null?null:num(x.rem),acc:['Uniform','Start','End'].includes(x.acc)?x.acc:'Uniform'}))});
$('#psel').onchange=e=>openProject(e.target.value);
$('#pname').onchange=e=>{P.name=e.target.value.trim()||'Untitled project';renderProj();queueSave()};
$('#pnew').onclick=()=>{const p=mk('Untitled project',[]);S.projects.push(p);openProject(p.id);$('#pname').select()};
$('#pdup').onclick=()=>{const c=JSON.parse(JSON.stringify(P));c.id=mk('',[]).id;c.name=P.name+' (copy)';S.projects.push(c);openProject(c.id)};
$('#pdel').onclick=e=>{const b=e.target;
 if(!b.dataset.c){b.dataset.c=1;b.textContent='Confirm delete';setTimeout(()=>{delete b.dataset.c;b.textContent='Delete'},3000);return}
 delete b.dataset.c;b.textContent='Delete';S.projects=S.projects.filter(p=>p!==P);
 if(!S.projects.length)S.projects.push(mk('Untitled project',[]));openProject(S.projects[0].id)};
$('#pexp').onclick=()=>saveFile(slug(P.name)+'.json',pack([P],'project'));
$('#pall').onclick=()=>saveFile('p6cm-backup-'+new Date().toISOString().slice(0,10)+'.json',pack(S.projects,'backup'));
$('#pimp').onclick=()=>$('#pfile').click();
$('#pfile').onchange=async e=>{const fl=e.target.files[0];e.target.value='';if(!fl)return;
 try{const d=JSON.parse(await fl.text());const ps=(d.projects||(Array.isArray(d.acts)?[d]:[])).filter(p=>Array.isArray(p.acts));
  if(!ps.length)throw 0;
  ps.forEach(p=>S.projects.push(mk(String(p.name||'Imported project'),p.acts.map(clean),Array.isArray(p.wbs)?p.wbs.map(w=>({code:String(w.code),name:String(w.name||w.code)})):undefined)));
  openProject(S.projects[S.projects.length-ps.length].id);flash('Imported '+ps.length+' project(s)')}
 catch(err){flash('Could not read that file. Use a .json exported from this app.')}};
addEventListener('pagehide',()=>{if(P)store.set(JSON.stringify(S))});
function setView(v){view=v;$('#vact').classList.toggle('on',v==='act');$('#vwbs').classList.toggle('on',v==='wbs');
 $('#actbar').hidden=v!=='act';$('#wbsbar').hidden=v!=='wbs';$('#bot').style.display=v==='act'?'':'none';$('#split').style.display=v==='act'?'':'none';
 $('#top').style.flex=v==='act'?'':'1 1 auto';all()}
$('#vact').onclick=()=>setView('act');$('#vwbs').onclick=()=>setView('wbs');
$('#wadd').onclick=()=>{const m=P.wbs.reduce((m,w)=>/^\d+$/.test(w.code)?Math.max(m,+w.code):m,0);P.wbs.push({code:String(m+1),name:'New WBS'});wsort();renderTable()};
$('#top').addEventListener('change',e=>{const t=e.target,r=t.closest('tr[data-w]');if(view!=='wbs'||!r||!t.dataset.w)return;const w=P.wbs[+r.dataset.w];
 if(t.dataset.w==='name'){w.name=t.value.trim()||w.code;renderTable();return}
 const v=t.value.trim();
 if(!v||P.wbs.some(o=>o!==w&&o.code===v)){flash(!v?'WBS code can’t be empty.':'That WBS code already exists.');renderTable();return}
 acts.forEach(a=>{if(a.wbs===w.code)a.wbs=v});w.code=v;wsort();renderTable()});
$('#top').addEventListener('click',e=>{if(view!=='wbs')return;
 const c=e.target.closest('[data-wc]'),d=e.target.closest('[data-wd]');
 if(c){const pc=P.wbs[+c.dataset.wc].code,m=P.wbs.reduce((m,w)=>{const x=w.code.startsWith(pc+'.')?w.code.slice(pc.length+1):'';return /^\d+$/.test(x)?Math.max(m,+x):m},0);
  P.wbs.push({code:pc+'.'+(m+1),name:'New WBS'});wsort();renderTable()}
 if(d){const w=P.wbs[+d.dataset.wd];let n=0;acts.forEach(a=>{if(a.wbs===w.code){a.wbs='';n++}});P.wbs.splice(+d.dataset.wd,1);renderTable();flash(n?n+(n>1?' activities have':' activity has')+' no WBS now.':'WBS deleted.')}});
load();
</script></body></html>
