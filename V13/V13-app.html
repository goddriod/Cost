<style>
:root{--bg:#e9edf2;--panel:#fff;--bar:#1f3a5f;--bart:#fff;--line:#cfd6df;--head:#dfe6ee;--sel:#cfe3fb;--alt:#f6f8fb;--txt:#1b2430;--mut:#64707f;--acc:#1f6fd1;--neg:#c0392b;--pos:#1e8449;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171e;--panel:#1a212b;--bar:#0e2340;--line:#303b49;--head:#243040;--sel:#27456e;--alt:#1e2631;--txt:#e4e9f0;--mut:#8f9cad;--acc:#5aa2f5;--neg:#ff7b6b;--pos:#59c48a}}
:root[data-theme="dark"]{--bg:#12171e;--panel:#1a212b;--bar:#0e2340;--line:#303b49;--head:#243040;--sel:#27456e;--alt:#1e2631;--txt:#e4e9f0;--mut:#8f9cad;--acc:#5aa2f5;--neg:#ff7b6b;--pos:#59c48a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:13px/1.35 "Segoe UI",Tahoma,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--bar);color:var(--bart);padding:6px 12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:14px;margin:0;font-weight:600}header span{opacity:.75;font-size:12px}
.tb{display:flex;gap:6px;padding:6px 8px;background:var(--head);border-bottom:1px solid var(--line);align-items:center}
button{font:inherit;color:var(--txt);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}button.p{background:var(--acc);border-color:var(--acc);color:#fff}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.tb .sp{flex:1}
#top{flex:1 1 55%;min-height:90px;overflow:auto;background:var(--panel)}
#split{height:7px;background:var(--head);border-top:1px solid var(--line);border-bottom:1px solid var(--line);cursor:row-resize;flex:none;touch-action:none}
#bot{flex:1 1 45%;min-height:90px;display:flex;flex-direction:column;background:var(--panel)}
.tabs{display:flex;background:var(--head);border-bottom:1px solid var(--line);align-items:flex-end;padding:4px 8px 0;gap:2px}
.tab{padding:5px 14px;border:1px solid transparent;border-bottom:0;border-radius:3px 3px 0 0;cursor:pointer;color:var(--mut)}
.tab.on{background:var(--panel);border-color:var(--line);color:var(--txt);font-weight:600;margin-bottom:-1px}
.tabs .ttl{margin-left:auto;color:var(--mut);font-size:12px;padding-bottom:5px}
#pane{flex:1;overflow:auto;padding:8px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{border:1px solid var(--line);padding:3px 7px;white-space:nowrap}
th{background:var(--head);position:sticky;top:0;text-align:left;font-weight:600;z-index:1}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
#top tbody tr{cursor:default}#top tbody tr:nth-child(even){background:var(--alt)}#top tbody tr.sel{background:var(--sel)}
tfoot td{font-weight:600;background:var(--head);position:sticky;bottom:0}
.neg{color:var(--neg)}.pos{color:var(--pos)}
td input,td select{width:100%;border:0;background:transparent;color:inherit;font:inherit;padding:2px 0}
td input.n{text-align:right}td input:focus,td select:focus{background:var(--panel)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px;max-width:900px}
.form label{display:flex;flex-direction:column;gap:3px;color:var(--mut);font-size:12px}
.form input,.form select{font:inherit;padding:5px 7px;border:1px solid var(--line);border-radius:3px;background:var(--panel);color:var(--txt)}
.form input:disabled{background:var(--alt);color:var(--mut)}
.note{color:var(--mut);margin:8px 0;font-size:12px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;max-width:900px}
.sum div{border:1px solid var(--line);padding:8px 10px;border-radius:3px}.sum b{display:block;font-size:17px;font-variant-numeric:tabular-nums}.sum small{color:var(--mut)}
.empty{color:var(--mut);padding:24px;text-align:center}
.tb{flex-wrap:wrap}#psel,.pn{font:inherit;padding:4px 7px;border:1px solid var(--line);border-radius:3px;background:var(--panel);color:var(--txt)}#psel{max-width:220px}.pn{flex:1 1 140px;min-width:120px}[hidden]{display:none!important}.grp{display:flex;gap:6px}button.on{background:var(--bar);color:#fff;border-color:var(--bar)}
.tot{display:block;font-weight:700;color:var(--acc);min-height:1.35em}.tot.neg{color:var(--neg)}
#top tbody tr{background:var(--panel)}
#top th:nth-child(-n+2),#top td:nth-child(-n+2){position:sticky;z-index:2;background:inherit;overflow:hidden;text-overflow:ellipsis}
#top th:nth-child(-n+2){z-index:4;background:var(--head)}
#top th:first-child,#top td:first-child{left:0;width:100px;min-width:100px;max-width:100px}
#top th:nth-child(2),#top td:nth-child(2){left:100px;min-width:150px;max-width:190px;box-shadow:2px 0 0 var(--line)}
.menu{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 10px;max-height:65vh;overflow:auto;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.menu label,.cols label,.inl{display:flex;gap:8px;align-items:center;padding:4px 2px}.menu small{color:var(--mut);display:block;margin-top:6px}
.rep{padding:10px 12px}.rep h3{margin:0 0 8px}.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px 12px;max-width:900px;margin:6px 0}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
#dlg .box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;max-width:620px;width:100%;max-height:85vh;display:flex;flex-direction:column;gap:10px}
#db{overflow:auto;border:1px solid var(--line)}#db table{min-width:0}#dlg .row{display:flex;gap:8px;justify-content:flex-end}
header svg{width:28px;height:28px;flex:none}/* V11: easier scrolling on phones */
header{padding:4px 10px}
.tb{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.tb::-webkit-scrollbar{display:none}.tb>*{flex:none}.tb .sp{flex:1 0 6px}
.pn{flex:0 0 150px}#psel{max-width:150px}
#top,#pane{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#top::-webkit-scrollbar,#pane::-webkit-scrollbar,#db::-webkit-scrollbar{width:18px;height:18px}
#top::-webkit-scrollbar-track,#pane::-webkit-scrollbar-track,#db::-webkit-scrollbar-track{background:var(--head)}
#top::-webkit-scrollbar-thumb,#pane::-webkit-scrollbar-thumb,#db::-webkit-scrollbar-thumb{background:var(--mut);border-radius:9px;border:4px solid var(--head);min-height:56px;min-width:56px}
#top::-webkit-scrollbar-corner,#pane::-webkit-scrollbar-corner{background:var(--head)}
@supports not selector(::-webkit-scrollbar){#top,#pane,#db{scrollbar-width:auto;scrollbar-color:var(--mut) var(--head)}}
#split{height:18px;position:relative}
#split::after{content:"";position:absolute;left:50%;top:50%;width:56px;height:5px;margin:-2px 0 0 -28px;border-radius:3px;background:var(--mut)}
#top.nofreeze td:nth-child(-n+2){position:static;box-shadow:none}#top.nofreeze th:nth-child(-n+2){left:auto;box-shadow:none}
@media (max-width:640px){
#top th:first-child,#top td:first-child{width:64px;min-width:64px;max-width:64px;font-size:12px}
#top th:nth-child(2),#top td:nth-child(2){left:64px;min-width:110px;max-width:130px;font-size:12px}
#top td,#top th{padding:3px 5px}}
/* V12: adjustable column widths, toast */
#top th:first-child,#top td:first-child,#top th:nth-child(2),#top td:nth-child(2){min-width:0;max-width:none;width:auto}
#top th:nth-child(2),#top td:nth-child(2){left:var(--w1,100px)}
#top td,#top th{overflow:hidden;text-overflow:ellipsis}
.rz{position:absolute;right:0;top:0;bottom:0;width:18px;cursor:col-resize;touch-action:none;z-index:5}
.rz::after{content:"";position:absolute;right:7px;top:18%;bottom:18%;width:3px;border-radius:2px;background:var(--mut);opacity:.7}
#top.wrapnames td:nth-child(2){white-space:normal}
.menu button{margin:6px 6px 0 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 16px;border-radius:8px;z-index:50;max-width:90vw;box-shadow:0 4px 14px rgba(0,0,0,.4);text-align:center}
</style></head><body>
<header><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a5a96"/><stop offset="1" stop-color="#0e2340"/></linearGradient></defs><rect width="100" height="100" rx="22" fill="url(#lg)"/><rect x="16" y="19" width="44" height="8" rx="4" fill="#5aa2f5"/><rect x="28" y="32" width="46" height="8" rx="4" fill="#fff"/><rect x="40" y="45" width="40" height="8" rx="4" fill="#4cd3a1"/><g fill="none" stroke="#ffd166" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"><path d="M40 87V65L60 87V65"/><path d="M33 71H67M33 80H67" stroke-width="3.5"/></g></svg><h1>Activity &amp; Cost Manager</h1><span id="ver"></span></header>
<div class="tb"><select id="psel" aria-label="Project"></select><input class="pn" id="pname" aria-label="Project name"><button id="pnew">New</button><button id="pdup">Duplicate</button><button id="pdel">Delete</button><span class="sp"></span><button id="pexp">Export</button><button id="pall">Backup all</button><button id="pimp">Import</button><input type="file" id="pfile" accept=".json,.xlsx,.xls,.csv,.txt,.pdf" hidden></div>

<div id="split" title="Drag to resize"></div>
<div id="bot"><div class="tabs" id="tabs"></div><div id="pane"></div></div>

<div id="dlg" hidden><div class="box"><h3 id="dt" style="margin:0"></h3><div id="db"></div><div class="row"><button id="dno">Cancel</button><button class="p" id="dok"></button></div></div></div>
<script>
const $=s=>document.querySelector(s);
const CATS=['Labor','Materials','Equipment','Subcontract','Permits & fees','Other'];
let nx=1,ex=1;
const E=(item,cat,bud,act,acc,rem=null)=>({id:'EX'+String(ex++).padStart(4,'0'),item,cat,bud,act,rem,acc});
const sampleActs=()=>{ex=1;return [
 {id:'A1000',name:'Site mobilization',wbs:'1.1',dur:10,mode:'direct',bud:48000,act:48000,rem:null,ex:[]},
 {id:'A1010',name:'Excavation & shoring',wbs:'1.2',dur:25,mode:'rollup',bud:0,act:0,rem:null,ex:[E('Excavation crew','Labor',90000,95000,'Uniform',0),E('Shoring steel','Materials',120000,118000,'Start',0),E('Excavator rental','Equipment',60000,41000,'Uniform')]},
 {id:'A1020',name:'Foundation concrete',wbs:'2.1',dur:30,mode:'rollup',bud:0,act:0,rem:null,ex:[E('Ready-mix concrete','Materials',210000,120000,'Uniform'),E('Rebar supply','Materials',95000,95000,'Start'),E('Pump truck','Equipment',24000,9000,'Uniform'),E('Concrete finishers','Labor',70000,38000,'Uniform')]},
 {id:'A1030',name:'Structural steel erection',wbs:'2.2',dur:45,mode:'rollup',bud:0,act:0,rem:null,ex:[E('Steel fabrication','Subcontract',480000,150000,'Start'),E('Crane hire','Equipment',130000,0,'Uniform'),E('Erection crew','Labor',160000,0,'End')]},
 {id:'A1040',name:'Building permit renewal',wbs:'2.3',dur:5,mode:'direct',bud:18500,act:21200,rem:0,ex:[]},
 {id:'A1050',name:'MEP rough-in',wbs:'3.1',dur:40,mode:'direct',bud:325000,act:60000,rem:null,ex:[]},
 {id:'A1060',name:'Facade & glazing',wbs:'3.2',dur:35,mode:'rollup',bud:0,act:0,rem:null,ex:[E('Curtain wall panels','Materials',410000,0,'Start'),E('Glazing installers','Subcontract',185000,0,'Uniform')]},
 {id:'A1070',name:'Commissioning & handover',wbs:'4.1',dur:15,mode:'direct',bud:42000,act:0,rem:null,ex:[]}
];};
const sampleWbs=()=>[['1','Site works'],['1.1','Mobilization'],['1.2','Earthworks'],['2','Structure'],['2.1','Substructure'],['2.2','Superstructure'],['2.3','Approvals'],['3','Services & envelope'],['3.1','MEP'],['3.2','Facade'],['4','Closeout'],['4.1','Commissioning']].map(([code,name])=>({code,name}));
let acts=[],sel=null,tab='exp',view='act',showDet=true;
const num=v=>{v=parseFloat(v);return isFinite(v)?v:0};
const autoRem=(b,a)=>Math.max(0,b-a);
const remOf=(b,a,r)=>r==null?autoRem(b,a):r;
function calc(a){let bud,act,rem;
 if(a.mode==='rollup'){bud=a.ex.reduce((s,x)=>s+x.bud,0);act=a.ex.reduce((s,x)=>s+x.act,0);rem=a.ex.reduce((s,x)=>s+remOf(x.bud,x.act,x.rem),0)}
 else{bud=a.bud;act=a.act;rem=remOf(a.bud,a.act,a.rem)}
 const ac=act+rem;return{bud,act,rem,ac,vac:bud-ac}}
const f=v=>'₦'+Math.round(v).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vc=v=>`<td class="n ${v<-0.5?'neg':v>0.5?'pos':''}">${v<-0.5?'('+f(-v)+')':f(v)}</td>`;
const cur=()=>acts.find(a=>a.id===sel);

const fv=v=>v<-0.5?'('+f(-v)+')':f(v);
const H=(l,v,c)=>`<th class="n">${l}<span class="tot ${c||''}">${v}</span></th>`;
const B='<span class="tot">&nbsp;</span>';
const xs=(a,k)=>a.ex.reduce((t,x)=>t+(k==='r'?remOf(x.bud,x.act,x.rem):x[k]),0);
const COLS=[
{k:'id',l:'Activity ID',fixed:1,v:a=>a.id},{k:'name',l:'Activity Name',fixed:1,v:a=>a.name},
{k:'wbs',l:'WBS',v:a=>wbsName(a.wbs)},{k:'dur',l:'Duration',n:1,v:a=>a.dur},
{k:'bud',l:'Budgeted Total Cost',n:1,m:1,v:(a,c)=>c.bud},{k:'act',l:'Actual Total Cost',n:1,m:1,v:(a,c)=>c.act},
{k:'rem',l:'Remaining Cost',n:1,m:1,v:(a,c)=>c.rem},{k:'ac',l:'At Completion Cost',n:1,m:1,v:(a,c)=>c.ac},
{k:'vac',l:'Variance at Completion',n:1,m:1,v:(a,c)=>c.vac},
{k:'exn',l:'Expense Items',n:1,v:a=>a.ex.length},{k:'exb',l:'Expense Budgeted',n:1,m:1,v:a=>xs(a,'bud')},
{k:'exa',l:'Expense Actual',n:1,m:1,v:a=>xs(a,'act')},{k:'exr',l:'Expense Remaining',n:1,m:1,v:a=>xs(a,'r')}];
const DEF=['wbs','dur','bud','act','rem','ac','vac'];
const cwid=c=>{const d=innerWidth<640;return(S.widths&&S.widths[c.k])||({id:d?64:90,name:d?130:230,wbs:d?100:140,dur:80,exn:90}[c.k])||(c.m?(d?120:150):120)};
const vis=()=>COLS.filter(c=>c.fixed||(S.cols||DEF).includes(c.k));
const rvis=()=>COLS.filter(c=>c.fixed||(S.rcols||DEF).includes(c.k));
const cell=(c,a,cc)=>{const v=c.v(a,cc);if(c.k==='vac')return vc(v);return c.n?`<td class="n">${c.m?f(v):c.k==='dur'?v+'d':v}</td>`:`<td title="${esc(v)}">${esc(v)}</td>`};
function renderTable(){
 $('#top').classList.toggle('nofreeze',!!S.nofreeze);$('#top').classList.toggle('wrapnames',!!S.wrap);$('#fz').classList.toggle('on',!S.nofreeze);
 if(view==='wbs'){renderWbs();queueSave();return}
 if(view==='rep'){renderReport();queueSave();return}
 const cols=vis(),cs=acts.map(calc),ws=cols.map(cwid),tw=ws.reduce((a,b)=>a+b,0),cg=ws.map(w=>`<col style="width:${w}px">`).join('');$('#top').style.setProperty('--w1',ws[0]+'px');
 const head=cols.map((c,i)=>{const t=c.n?cs.reduce((n,x,j)=>n+c.v(acts[j],x),0):null;
  const ts=i===0?'Total':t===null?'&nbsp;':c.k==='dur'?t+'d':c.k==='vac'?fv(t):c.m?f(t):t;
  return`<th${c.n?' class="n"':''}>${c.l}<span class="tot ${c.k==='vac'&&t<-0.5?'neg':''}">${ts}</span><span class="rz" data-k="${c.k}"></span></th>`}).join('');
 const rows=acts.map((a,i)=>`<tr data-id="${esc(a.id)}" class="${a.id===sel?'sel':''}">${cols.map(c=>cell(c,a,cs[i])).join('')}</tr>`).join('');
 $('#top').innerHTML=`<table style="table-layout:fixed;width:${tw}px;min-width:0"><colgroup>${cg}</colgroup><thead><tr>${head}</tr></thead><tbody>${rows||`<tr><td colspan="${cols.length}" class="empty">No activities yet. Select Add activity to create one.</td></tr>`}</tbody></table>`;
 $('#cnt').textContent=acts.length+' activities';queueSave();
}
const wcmp=(a,b)=>{const x=a.split('.'),y=b.split('.');for(let i=0;i<Math.max(x.length,y.length);i++){const p=x[i],q=y[i];if(p===undefined)return -1;if(q===undefined)return 1;const d=parseFloat(p)-parseFloat(q);if(d)return d;if(p!==q)return p<q?-1:1}return 0};
const wsort=()=>P.wbs.sort((a,b)=>wcmp(a.code,b.code));
const wbsName=c=>{const w=P.wbs.find(x=>x.code===c);return w?w.name:c};
function wbsCost(code){const t={n:0,bud:0,act:0,ac:0};acts.forEach(a=>{if(a.wbs===code||a.wbs.startsWith(code+'.')){const c=calc(a);t.n++;t.bud+=c.bud;t.act+=c.act;t.ac+=c.ac}});return t}
function wbsOptions(cur){let h='<option value="">(none)</option>';const L=P.wbs.map(w=>w.code);
 if(cur&&!L.includes(cur))h+=`<option value="${esc(cur)}" selected>${esc(cur)} (not in WBS list)</option>`;
 return h+P.wbs.map(w=>`<option value="${esc(w.code)}" ${w.code===cur?'selected':''}>${esc(w.name+(P.wbs.filter(x=>x.name===w.name).length>1?' ('+w.code+')':''))}</option>`).join('')}
function renderWbs(){
 $('#top').style.setProperty('--w1','110px');
 const T=acts.reduce((o,a)=>{const c=calc(a);o.bud+=c.bud;o.act+=c.act;o.ac+=c.ac;return o},{bud:0,act:0,ac:0});
 const rows=P.wbs.map((w,i)=>{const c=wbsCost(w.code),d=w.code.split('.').length-1;
  return`<tr data-w="${i}"><td><input data-w="code" value="${esc(w.code)}"></td><td><input data-w="name" style="padding-left:${d*16}px" value="${esc(w.name)}"></td><td class="n">${c.n}</td><td class="n">${f(c.bud)}</td><td class="n">${f(c.act)}</td><td class="n">${f(c.ac)}</td>${vc(c.bud-c.ac)}<td><button data-wc="${i}">Add child</button> <button data-wd="${i}">Delete</button></td></tr>`}).join('');
 $('#top').innerHTML=`<table style="table-layout:fixed;width:1240px;min-width:0"><colgroup><col style="width:110px"><col style="width:230px"><col style="width:100px"><col style="width:150px"><col style="width:150px"><col style="width:150px"><col style="width:150px"><col style="width:200px"></colgroup><thead><tr><th>WBS Code<span class="tot">Project total</span></th><th>WBS Name${B}</th><th class="n">Activities<span class="tot">${acts.length}</span></th>${H('Budgeted Total Cost',f(T.bud))}${H('Actual Total Cost',f(T.act))}${H('At Completion Cost',f(T.ac))}${H('Variance at Completion',fv(T.bud-T.ac),T.bud-T.ac<-0.5?'neg':'')}<th>${B}</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">No WBS yet. Select Add WBS, then pick it from the WBS list on an activity’s General tab.</td></tr>'}</tbody></table><p class="note" style="padding:0 8px">Costs include child elements (for example 2 includes 2.1 and 2.2). Use dotted codes to build levels.</p>`}
function renderTabs(){
 const a=cur();
 $('#tabs').innerHTML=[['gen','General'],['exp','Expenses'],['cost','Cost Summary']].map(([k,l])=>`<div class="tab ${tab===k?'on':''}" data-t="${k}" role="tab" tabindex="0">${l}</div>`).join('')+`<span class="ttl">${a?esc(a.id+' · '+a.name):''}</span>`;
}
function renderPane(){
 const a=cur(),p=$('#pane');
 if(!a){p.innerHTML='<div class="empty">Select an activity to see its details.</div>';return}
 const c=calc(a);
 if(tab==='gen'){
  const ro=a.mode==='rollup';
  p.innerHTML=`<div class="form">
  <label>Activity ID<input data-f="id" value="${esc(a.id)}"></label>
  <label>Activity Name<input data-f="name" value="${esc(a.name)}"></label>
  <label>WBS<select data-f="wbs">${wbsOptions(a.wbs)}</select></label>
  <label>Duration (days)<input data-f="dur" type="number" min="0" value="${a.dur}"></label>
  <label>Cost source<select data-f="mode"><option value="direct" ${ro?'':'selected'}>Enter directly</option><option value="rollup" ${ro?'selected':''}>Roll up from expenses</option></select></label>
  <label>Budgeted Total Cost<input data-f="bud" type="number" min="0" ${ro?'disabled':''} value="${ro?c.bud:a.bud}"></label>
  <label>Actual Total Cost<input data-f="act" type="number" min="0" ${ro?'disabled':''} value="${ro?c.act:a.act}"></label>
  <label>Remaining Cost${ro?'':' (blank = auto)'}<input data-f="rem" type="number" min="0" ${ro?'disabled':''} placeholder="${f(autoRem(a.bud,a.act))}" value="${ro?c.rem:(a.rem==null?'':a.rem)}"></label></div>
  <p class="note">${P.wbs.length?'':'No WBS created yet. Add elements in the WBS view, then choose one here. '}${ro?'Costs are summed from this activity’s expenses. Edit them on the Expenses tab.':'Remaining defaults to Budgeted − Actual (never below zero). Type a value to override it.'}</p>`;
 }else if(tab==='exp'){
  const rows=a.ex.map((x,i)=>`<tr data-i="${i}"><td>${esc(x.id)}</td><td><input data-x="item" value="${esc(x.item)}"></td><td><select data-x="cat">${CATS.map(k=>`<option ${k===x.cat?'selected':''}>${k}</option>`).join('')}</select></td><td><input class="n" type="number" min="0" data-x="bud" value="${x.bud}"></td><td><input class="n" type="number" min="0" data-x="act" value="${x.act}"></td><td><input class="n" type="number" min="0" data-x="rem" placeholder="${Math.round(autoRem(x.bud,x.act))}" value="${x.rem==null?'':x.rem}"></td><td><select data-x="acc">${['Uniform','Start','End'].map(k=>`<option ${k===x.acc?'selected':''}>${k}</option>`).join('')}</select></td><td><button data-d="${i}" aria-label="Delete expense">Delete</button></td></tr>`).join('');
  const s=a.ex.reduce((o,x)=>(o.b+=x.bud,o.a+=x.act,o.r+=remOf(x.bud,x.act,x.rem),o),{b:0,a:0,r:0});
  p.innerHTML=`<div style="margin-bottom:6px"><button class="p" id="addx">Add expense</button></div>
  <table><thead><tr><th>Expense ID<span class="tot">Total</span></th><th>Expense Item${B}</th><th>Category${B}</th>${H('Budgeted Cost',f(s.b))}${H('Actual Cost',f(s.a))}${H('Remaining Cost',f(s.r))}<th>Accrual Type${B}</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">No expenses yet. Select Add expense.</td></tr>'}</tbody></table>
  <p class="note">${a.mode==='rollup'?'These expenses drive the activity’s costs.':'This activity is set to direct entry, so expenses are not counted. Switch Cost source to “Roll up from expenses” on the General tab.'} Leave Remaining blank to calculate Budgeted − Actual.</p>`;
 }else{
  p.innerHTML=`<div class="sum"><div><small>Budgeted Total Cost</small><b>${f(c.bud)}</b></div><div><small>Actual Total Cost</small><b>${f(c.act)}</b></div><div><small>Remaining Cost</small><b>${f(c.rem)}</b></div><div><small>At Completion Cost (Actual + Remaining)</small><b>${f(c.ac)}</b></div><div><small>Variance at Completion (Budgeted − At Completion)</small><b class="${c.vac<-0.5?'neg':c.vac>0.5?'pos':''}">${c.vac<-0.5?'('+f(-c.vac)+')':f(c.vac)}</b></div></div>
  <p class="note">${c.vac<-0.5?'Forecast is over budget.':c.vac>0.5?'Forecast is under budget.':'Forecast matches budget.'} Source: ${a.mode==='rollup'?'rolled up from '+a.ex.length+' expense(s)':'direct entry'}.</p>`;
 }
}
const all=()=>{renderTable();renderTabs();renderPane()};

$('#top').onclick=e=>{const r=e.target.closest('tr[data-id]');if(r){sel=r.dataset.id;all()}};
$('#tabs').onclick=e=>{const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;renderTabs();renderPane()}};
$('#add').onclick=()=>{const a={id:nextId(),name:'New activity',wbs:'',dur:1,mode:'direct',bud:0,act:0,rem:null,ex:[]};acts.push(a);sel=a.id;tab='gen';all();$('#top').scrollTop=1e6};
$('#del').onclick=()=>{const i=acts.findIndex(a=>a.id===sel);if(i<0){flash('Select an activity first.');return}const a=acts[i];
 showDlg('Delete this activity?',`<p style="padding:10px 12px;margin:0"><b>${esc(a.id)} · ${esc(a.name)}</b><br>It will be removed from the project${a.ex.length?', together with its '+a.ex.length+' expense line(s)':''}. This cannot be undone.</p>`,'Delete',()=>{const j=acts.indexOf(a);if(j<0)return;acts.splice(j,1);sel=acts.length?acts[Math.min(j,acts.length-1)].id:null;all()})};

const pane=$('#pane');
pane.addEventListener('input',e=>{ // live update for General fields
 const a=cur(),k=e.target.dataset.f;if(!a||!k||k==='mode')return;
 let v=e.target.value;
 if(k==='id'){v=v.trim();if(!v||acts.some(o=>o!==a&&o.id===v))return;sel=v}
 if(k==='dur')v=Math.max(0,Math.round(num(v)));
 if(k==='bud'||k==='act')v=num(v);
 if(k==='rem')v=v===''?null:num(v);
 a[k]=v;renderTable();renderTabs();
});
pane.addEventListener('change',e=>{
 const a=cur(),t=e.target;if(!a)return;
 if(t.dataset.f==='mode'){a.mode=t.value;all();return}
 const r=t.closest('tr[data-i]');
 if(r&&t.dataset.x){const x=a.ex[+r.dataset.i],k=t.dataset.x;
  x[k]=k==='rem'?(t.value===''?null:num(t.value)):(k==='bud'||k==='act')?num(t.value):t.value;
  renderTable();renderPane()}
});
pane.addEventListener('click',e=>{
 const a=cur();if(!a)return;
 if(e.target.id==='addx'){a.ex.push(E('New expense','Other',0,0,'Uniform'));renderTable();renderPane()}
 if(e.target.dataset.d!==undefined){const x=a.ex[+e.target.dataset.d];showDlg('Delete this expense?','<p style="padding:10px 12px;margin:0"><b>'+esc(x.item)+'</b> ('+f(x.bud)+' budgeted) will be removed. This cannot be undone.</p>','Delete',()=>{const j=a.ex.indexOf(x);if(j>=0)a.ex.splice(j,1);renderTable();renderPane()})}
});

// resizable split
const sp=$('#split');
sp.addEventListener('pointerdown',e=>{sp.setPointerCapture(e.pointerId);
 const mv=ev=>{const h=document.body.clientHeight,top=$('#top').getBoundingClientRect().top;
  const y=Math.min(Math.max(ev.clientY-top,90),h-top-130);
  $('#top').style.flex='0 0 '+y+'px';$('#bot').style.flex='1 1 0'};
 sp.addEventListener('pointermove',mv);
 sp.addEventListener('pointerup',()=>sp.removeEventListener('pointermove',mv),{once:true})});
// ---- V1: projects, autosave, export/import ----
const VERSION='V13',KEY='p6cm-projects';let mem=null,P,S,tm;
const store={get(){try{return localStorage.getItem(KEY)}catch(e){return mem}},set(v){try{localStorage.setItem(KEY,v)}catch(e){mem=v}}};
const mk=(name,a,w)=>({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,acts:a,wbs:w,updated:Date.now()});
const nextId=()=>{const m=acts.reduce((m,a)=>{const r=/^A(\d+)$/.exec(a.id);return r?Math.max(m,+r[1]):m},990);return 'A'+(m+10)};
function queueSave(){clearTimeout(tm);tm=setTimeout(()=>{if(P){P.updated=Date.now();store.set(JSON.stringify(S))}},250)}
function flash(t,ms){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e)}e.textContent=t;e.hidden=false;clearTimeout(flash.t);flash.t=setTimeout(()=>{e.hidden=true},ms||3500)}
function renderProj(){$('#psel').innerHTML=S.projects.map(p=>`<option value="${p.id}" ${p===P?'selected':''}>${esc(p.name)}</option>`).join('');$('#pname').value=P.name}
function openProject(id){P=S.projects.find(p=>p.id===id);S.cur=id;acts=P.acts;if(!Array.isArray(P.wbs)){P.wbs=[...new Set(acts.map(a=>a.wbs).filter(Boolean))].map(c=>({code:c,name:c}));wsort()}
 ex=1+acts.reduce((m,a)=>a.ex.reduce((m2,x)=>Math.max(m2,parseInt(String(x.id).slice(2))||0),m),0);

  if(isA||isE){kind=isE?'e':'a';M={};const keys=isE?['aid','eid','item','cat','bud','act','rem','acc']:['id','name','wbs','dur','bud','act','rem'];keys.forEach(k=>{const i=c.findIndex(x=>HM[k].test(x));if(i>=0)M[k]=i});continue}
  if(!M)continue;const g=k=>M[k]==null?'':r[M[k]];
  if(kind==='a'){const nm=String(g('name')).trim(),id=String(g('id')).trim();if(!nm||/^(project\s+)?total$/i.test(id)||/^total$/i.test(nm))continue;
   out.acts.push({id,name:nm,wbs:String(g('wbs')).trim(),dur:Math.max(1,Math.round(n2(g('dur')))||1),bud:n2(g('bud')),act:n2(g('act')),rem:M.rem==null?null:n2(g('rem'))})}
  else{const it=String(g('item')).trim();if(it)out.exps.push({aid:String(g('aid')).trim(),item:it,cat:String(g('cat')).trim(),bud:n2(g('bud')),act:n2(g('act')),rem:M.rem==null?null:n2(g('rem')),acc:['Uniform','Start','End'].includes(String(g('acc')).trim())?String(g('acc')).trim():'Uniform'})}}
 return out}
function parseLines(lines){const out=[];
 const tidy=n=>n.replace(/^\s*(?:and\s+)?\d+[a-z]?\s*[.)]\s*/i,'').replace(/^\s*and\s+/i,'').replace(/\s+\)/g,')').replace(/\(\s+/g,'(').replace(/[;,:\s]+$/,'').replace(/\s{2,}/g,' ').trim();
 const mk2=(id,name,bud)=>({id,name,wbs:'',dur:1,bud,act:0,rem:null});
 for(const raw of lines){const l=raw.replace(/\s+/g,' ').trim();if(!l||/^(project\s+)?total\b/i.test(l))continue;
  const re=/([^@]*?)@\s*(?:NGN|[N₦#])?\s*(\d[\d,]*(?:\.\d+)?)/gi;let m,k=0,first='',any=false;
  while((m=re.exec(l))){any=true;let nm=tidy(m[1]);const pre=(first.match(/^[A-Za-z]+ of /i)||[''])[0];
   if(k>0&&pre&&!/^[A-Za-z]+ of /i.test(nm))nm=pre+nm;if(k===0)first=nm;k++;if(nm)out.push(mk2('',nm,+m[2].replace(/,/g,'')||0))}
  if(any)continue;
  let id='',t=l;const im=t.match(/^([A-Z]{1,3}\d{2,5})\s+(.*)$/);if(im){id=im[1];t=im[2]}
  const am=t.match(/^(?:\d+[a-z]?\s*[.)]\s*)?(.*?)\s+(?:NGN|[N₦#])?\s*(\d{1,3}(?:,\d{3})+(?:\.\d+)?|\d{4,})(?:\s|$)/i);
  if(am&&tidy(am[1])){out.push(mk2(id,tidy(am[1]),+am[2].replace(/,/g,'')));continue}
  const nm=t.match(/^\d+[a-z]?\s*[.)]\s+(.+)$/);if(nm)out.push(mk2(id,tidy(nm[1]),0))}
 return out}
function wbsFor(t){t=String(t).trim();const w=P.wbs.find(w=>w.code===t||w.name.toLowerCase()===t.toLowerCase());if(w)return w.code;
 const m=P.wbs.reduce((m,w)=>/^\d+$/.test(w.code)?Math.max(m,+w.code):m,0);P.wbs.push({code:String(m+1),name:t});wsort();return String(m+1)}
function commitImport(list,exps){const map={};
 list.forEach(x=>{let id=x.id;if(!id||acts.some(a=>a.id===id))id=nextId();map[x.id||'']=id;
  const rem=x.rem==null||Math.abs(x.rem-autoRem(x.bud,x.act))<0.5?null:x.rem;
  acts.push({id,name:x.name,wbs:x.wbs?wbsFor(x.wbs):'',dur:x.dur||1,mode:'direct',bud:x.bud||0,act:x.act||0,rem,ex:[]})});
 exps.forEach(e=>{const a=acts.find(o=>o.id===map[e.aid]);if(!a)return;a.mode='rollup';a.ex.push({id:'EX'+String(ex++).padStart(4,'0'),item:e.item,cat:e.cat||'Other',bud:e.bud,act:e.act,rem:e.rem,acc:e.acc})});
 if(!sel&&acts.length)sel=acts[0].id;all();flash('Added '+list.length+' activities')}

$('#pfile').onchange=async e=>{const fl=e.target.files[0];e.target.value='';if(!fl)return;
 const ext=(fl.name.split('.').pop()||'').toLowerCase();let list=[],exps=[],lines=null;
 try{
  if(ext==='json'){const d=JSON.parse(await fl.text());const ps=(d.projects||(Array.isArray(d.acts)?[d]:[])).filter(p=>Array.isArray(p.acts));
   if(ps.length){addProjects(ps);return}
   if(Array.isArray(d))list=d.filter(x=>x&&x.name).map(x=>({id:String(x.id||''),name:String(x.name),wbs:String(x.wbs||''),dur:n2(x.dur)||1,bud:n2(x.bud),act:n2(x.act),rem:null}))}
  else if(ext==='xls')throw new Error('Save old .xls files as .xlsx or .csv first.');
  else if(ext==='xlsx'||ext==='csv'){let sheets;if(ext==='csv'){const t=await fl.text();sheets=[parseCsv(t)];lines=t.split(/\r?\n/)}else sheets=await readXlsx(new Uint8Array(await fl.arrayBuffer()));
   sheets.forEach(rows=>{const q=importAoa(rows);list.push(...q.acts);exps.push(...q.exps);if(ext==='xlsx'&&!q.acts.length&&!q.exps.length)lines=(lines||[]).concat(rows.map(x=>x.join(' ')))})}
  else if(ext==='txt'){const t=await fl.text(),q=importAoa(t.split(/\r?\n/).map(x=>x.split('\t')));list=q.acts;exps=q.exps;if(!list.length)lines=t.split(/\r?\n/)}
  else if(ext==='pdf'){const u8=new Uint8Array(await fl.arrayBuffer()),kw=new TextDecoder('latin1').decode(u8).match(/\/Keywords\s*<([0-9A-Fa-f]+)>/);
   if(kw){try{const pj=JSON.parse(kw[1].replace(/../g,h=>String.fromCharCode(parseInt(h,16))));if(Array.isArray(pj.acts)){addProjects([pj]);return}}catch(x){}}
   lines=[];for(const c of await pdfStreams(u8)){const its=pdfText(c).sort((a,b)=>b.y-a.y||a.x-b.x);let cur=[],py=null;
    const push=()=>{if(cur.length)lines.push(cur.sort((a,b)=>a.x-b.x).map(t=>t.t).join(' '));cur=[]};its.forEach(it=>{if(py!==null&&py-it.y>3)push();cur.push(it);py=it.y});push()}
   if(!lines.length)throw new Error('No readable text in this PDF. It may be scanned.')}
  else throw new Error('Use a .json, .xlsx, .csv, .txt or .pdf file.');
  if(!list.length&&lines)list=parseLines(lines);
  if(!list.length)throw new Error('No activities found in that file.');
  const body='<table><thead><tr><th>Activity</th><th class="n">Budget</th></tr></thead><tbody>'+list.map(x=>`<tr><td>${esc(x.name)}</td><td class="n">${f(x.bud)}</td></tr>`).join('')+'</tbody></table>';
  showDlg('Add '+list.length+' activities to “'+P.name+'”?',body+(exps.length?'<p class="note" style="padding:0 8px">Plus '+exps.length+' expense lines.</p>':'')+'<p class="note" style="padding:0 8px">Names and amounts are read from the file’s text, so check them after adding.</p>','Add activities',()=>commitImport(list,exps));
 }catch(err){flash(err.message&&err.message.length<90?err.message:'Could not read that file.')}};

async function doExport(){
 const fmt=rep.fmt,file=((rep.name||P.name).replace(/[\\/:*?"<>|]+/g,'-').replace(/\.(xlsx|pdf|txt|json)$/i,''))+'.'+FM[fmt][1];
 try{
  if(fmt==='json')return saveFile(file,pack([P],'project'));
  const cols=rvis(),cs=acts.map(calc),head=cols.map(c=>c.l),data=acts.map((a,i)=>cols.map(c=>c.v(a,cs[i])));

  const exH=['Activity ID','Expense ID','Expense Item','Category','Budgeted Cost','Actual Cost','Remaining Cost','Accrual Type'];
  const exR=rep.inc?acts.flatMap(a=>a.ex.map(x=>[a.id,x.id,x.item,x.cat,x.bud,x.act,remOf(x.bud,x.act,x.rem),x.acc])):[];
  if(fmt==='txt'){const cl=v=>String(v==null?'':v).replace(/[\t\r\n]+/g,' ');
   let t=[head,tots,...data].map(x=>x.map(cl).join('\t')).join('\n');if(exR.length)t+='\n\n'+[exH,...exR].map(x=>x.map(cl).join('\t')).join('\n');

  if(fmt==='xlsx'){const sh=[{name:'Activities',rows:[head,tots,...data],money:cols.map(c=>!!c.m),w:cols.map(c=>c.k==='name'?44:c.n?20:14),bold:2}];
   if(exR.length)sh.push({name:'Expenses',rows:[exH,...exR],money:[0,0,0,0,1,1,1,0],w:[12,12,34,16,16,16,16,12],bold:1});
   return saveBlob(file,makeXlsx(sh))}
  if(fmt==='pdf'){const W=842,Hh=595,M=30,pg=[[]];let cp=pg[0],y=M;
   const mon=v=>'₦'+Math.round(v).toLocaleString('en-US'),fv2=(c,v)=>c.m?mon(v):c.k==='dur'?v+'d':String(v==null?'':v);
   const T=(t,x,yy,sz,b,right)=>{t=asc2(t);const nw=.8*sz,ps=t.split('₦'),w=ps.reduce((n,q)=>n+sw(q,sz,b),0)+(ps.length-1)*nw,y0=Hh-yy,F=v=>v.toFixed(1);let cx=right?x-w:x;
    ps.forEach((q,i)=>{if(q)cp.push(`BT /F${b?2:1} ${sz} Tf ${F(cx)} ${F(y0)} Td (${q.replace(/[\\()]/g,'\\$&')}) Tj ET`);cx+=sw(q,sz,b);
     if(i<ps.length-1){const h=.718*sz,x1=cx+.08*sz,x2=x1+.5*sz,lw=(b?.11:.085)*sz,e=.08*sz;
      cp.push(`q 0 0 0 RG ${lw.toFixed(2)} w 0 J 0 j ${F(x1)} ${F(y0)} m ${F(x1)} ${F(y0+h)} l ${F(x2)} ${F(y0)} l ${F(x2)} ${F(y0+h)} l S ${(lw*.8).toFixed(2)} w ${F(x1-e)} ${F(y0+.34*h)} m ${F(x2+e)} ${F(y0+.34*h)} l S ${F(x1-e)} ${F(y0+.62*h)} m ${F(x2+e)} ${F(y0+.62*h)} l S Q`);cx+=nw}})};

   T(P.name+' - Activity report',M,y+10,13,1);T(new Date().toLocaleDateString('en-GB'),W-M,y+10,8,0,1);y+=26;
   const table=(h,rows,wts,nf)=>{const tw=wts.reduce((a,b)=>a+b,0),cw=wts.map(w=>w/tw*(W-2*M)),rh=15;
